apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: egress
spec:
  replicas: 1
  selector:
    matchLabels: {app: egress-proxy}
  template:
    metadata:
      labels: {app: egress-proxy}
    spec:
      initContainers:
      - name: copy-ca          # mitmproxy writes derived files into confdir, so it can't be a read-only secret mount
        image: alpine:3.20
        command: ["sh", "-c", "cp /ca-ro/mitmproxy-ca.pem /conf/ && chmod 644 /conf/mitmproxy-ca.pem"]
        volumeMounts:
        - {name: ca-ro, mountPath: /ca-ro}
        - {name: conf, mountPath: /conf}
      containers:
      - name: mitmproxy
        image: mitmproxy/mitmproxy:latest
        args: ["mitmdump", "--mode", "regular", "--listen-port", "8080",
               "--set", "confdir=/conf", "-s", "/addon/policy.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: conf, mountPath: /conf}
        - {name: addon, mountPath: /addon}
      volumes:
      - name: ca-ro
        secret: {secretName: mitm-ca}
      - name: conf
        emptyDir: {}
      - name: addon
        configMap: {name: egress-policy}
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: egress
spec:
  selector: {app: egress-proxy}
  ports:
  - {port: 8080, targetPort: 8080}
